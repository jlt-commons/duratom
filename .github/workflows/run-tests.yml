name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The suite covers the file and sqlite backends. The postgres backend goes
    # through the same jolt-lang/db sql path but has no tests here, so there is
    # no postgres service; libpq is optional in db's :jolt/native.
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt runtime deps and sqlite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libsqlite3-0
      - id: jolt
        uses: jlt-commons/setup-jolt@v1.0.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jolt/gitlibs
            ~/.jolt/mvnlibs
            ~/.m2/repository
          key: ${{ runner.os }}-jolt-${{ steps.jolt.outputs.version }}-${{ hashFiles('deps.edn') }}
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
